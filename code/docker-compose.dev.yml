version: "3.9"

# Development stack: SQLite backend with Flask's reloader, and the Vite dev
# server for the web frontend, both with source volumes mounted for
# hot-reload. No Postgres/Redis required.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Web UI (hot reload): http://localhost:3000
# Backend API:         http://localhost:5000/api/v1

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantumvest_backend_dev
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DATABASE_URL: sqlite:///quantumvest_dev.db
      SECRET_KEY: dev-secret-key-not-for-production
      JWT_SECRET_KEY: dev-jwt-secret-key-not-for-production
      CORS_ORIGINS: "http://localhost:3000"
      CACHE_TYPE: SimpleCache
    volumes:
      - ./backend:/app
      - dev_models:/app/resources/models
      - dev_data:/app/resources/data
    ports:
      - "5000:5000"
    command: python wsgi.py

  web-frontend:
    image: node:20-alpine
    container_name: quantumvest_web_dev
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    volumes:
      - ./web-frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  dev_models:
  dev_data:
  web_node_modules:
