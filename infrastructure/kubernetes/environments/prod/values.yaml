appName: quantumvest
namespace: quantumvest-production
environment: prod

backend:
  replicas: 5
  image:
    repository: registry.example.com/app/backend
    tag: production
    pullPolicy: Always
  containerPort: 8080
  servicePort: 80
  metrics:
    port: 9090
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
      storage: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi
      storage: 1Gi
  autoscaling:
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  deployment:
    maxSurge: "25%"
    maxUnavailable: "0"
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
  apiUrl: http://quantumvest-backend
  jwtSecret: ""
  apiKey: ""
  encryptionKey: ""
  apiKeyHash: ""
  logLevel: warn
  terminationGracePeriodSeconds: 60

frontend:
  replicas: 5
  image:
    repository: registry.example.com/app/frontend
    tag: production
    pullPolicy: Always
  containerPort: 80
  servicePort: 80
  apiUrl: /api
  service:
    type: ClusterIP
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    minReplicas: 5
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

database:
  # NOTE: this StatefulSet runs stock MySQL with no replication/clustering
  # configured — no init scripts wiring up binlog/GTID replication, and no
  # operator (e.g. Percona XtraDB Cluster, InnoDB Group Replication). Raising
  # replicas beyond 1 does NOT create a MySQL cluster; it creates that many
  # completely independent MySQL instances, each with its own separate data,
  # and the headless Service round-robins across them — meaning the app
  # could read/write inconsistent data depending on which pod it happens to
  # hit. For real HA, use either a proper MySQL operator or the
  # Terraform + RDS path (infrastructure/terraform/modules/database, which
  # supports multi_az).
  replicas: 1
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  containerPort: 3306
  servicePort: 3306
  name: quantumvestdb
  user: appuser
  # Secrets must be provided via external-secrets or Vault — never set here in plain text
  url: ""
  rootPassword: ""
  password: ""
  storageClass: premium-rwo
  storage: 50Gi
  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 2000m
      memory: 4Gi

redis:
  # No Redis Cluster/Sentinel configured — see the note on database.replicas
  # above; the same reasoning applies here.
  replicas: 1
  # Secrets must be provided via external-secrets or Vault — never set here in plain text
  url: ""
  # redis-server's --maxmemory needs its own unit suffixes (mb/gb), not
  # Kubernetes' Mi/Gi — keep this roughly in line with resources.limits.memory below.
  maxmemory: "1600mb"
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  containerPort: 6379
  servicePort: 6379
  storageClass: premium-rwo
  storage: 20Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

ingress:
  host: quantumvest.com
  class: nginx
  sslRedirect: "true"
  certManager:
    issuer: letsencrypt-prod

vault:
  address: https://vault.quantumvest.com
  image:
    tag: "1.15.2"

logLevel: warn
imagePullSecrets: regcred

# Referenced by templates/resource-quota.yaml — must exist as at least an
# empty "hard" map, or Helm errors on the nil-chain before the `| default`
# fallbacks in that template ever get a chance to apply.
resourceQuota:
  hard:
    requests_cpu: "60"
    requests_memory: "120Gi"
    limits_cpu: "100"
    limits_memory: "200Gi"
    persistentvolumeclaims: "40"
