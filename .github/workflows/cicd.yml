name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ======================================================================
  # Job 2 -- Backend Test & Build (Pytest + Docker image + smoke test)
  # ======================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend
      IMAGE_NAME: quantumvest-backend
      CONTAINER_NAME: quantumvest-backend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs as a non-root user
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "${IMAGE_NAME}:ci" -u)
          echo "Container user id: ${uid}"
          if [ "${uid}" = "0" ]; then
            echo "Image must not run as root." >&2
            exit 1
          fi

      - name: Smoke test the built image
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 5000:5000 \
            -e FLASK_ENV=docker \
            -e SECRET_KEY=ci-smoke-test-secret-key \
            -e JWT_SECRET_KEY=ci-smoke-test-jwt-secret-key \
            -e DATABASE_URL=sqlite:////tmp/quantumvest-ci.db \
            -e AI_AUTO_TRAIN=false \
            -e BLOCKCHAIN_ENABLED=false \
            "${IMAGE_NAME}:ci"

          echo "=== Waiting for backend health endpoint ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/v1/health -o health.json; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Backend did not become healthy in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "=== Health response ==="
          cat health.json
          echo
          grep -q '"status":"healthy"' <(tr -d ' \n' < health.json) || {
            echo "Health endpoint reported a non-healthy status." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          }

          echo "=== Checking Prometheus metrics endpoint ==="
          curl -fsS http://127.0.0.1:5000/metrics | grep -q http_requests_total

      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 3 -- AI Models Test & Validation (Pytest + coverage)
  # ============================================================
  ai_models_test:
    name: AI Models Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      AI_MODELS_DIR: code/ai_models
      # ai_models is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code
      # Keep TensorFlow quiet and make sure nothing tries to use a GPU on the runner.
      TF_CPP_MIN_LOG_LEVEL: "2"
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            code/ai_models/requirements.txt
            code/ai_models/requirements-dev.txt

      # requirements-dev.txt extends requirements.txt (TensorFlow, XGBoost,
      # LightGBM, ...) with CatBoost, pytest and pytest-cov.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "${AI_MODELS_DIR}/requirements-dev.txt"

      - name: Byte-compile all ai_models sources
        run: |
          set -euo pipefail
          echo "=== Compiling data, models, portfolio, risk, serving, training, evaluation and tests ==="
          python -m compileall -q "${AI_MODELS_DIR}"

      - name: Verify public API and sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          import ai_models

          for name in ai_models.__all__:
              getattr(ai_models, name)
              print(f"OK   ai_models.{name}")

          for module in (
              "data",
              "evaluation",
              "exceptions",
              "models",
              "portfolio",
              "risk",
              "serving",
              "training",
              "advanced_ai_models",
          ):
              importlib.import_module(f"ai_models.{module}")
              print(f"OK   ai_models.{module}")
          print(f"ai_models {ai_models.__version__} imports cleanly")
          PY

      - name: Run ai_models test suite
        working-directory: ${{ env.AI_MODELS_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=ai_models \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload ai_models coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-coverage-report
          path: code/ai_models/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 4 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 5 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 6 -- Blockchain Contracts (Compile & Test)
  # ============================================================
  blockchain_tests:
    name: Blockchain Contracts
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx truffle compile

      - name: Start ganache, run tests, and verify the migration
        run: |
          set -euo pipefail

          npx ganache \
            --port 8545 \
            --chain.chainId 1337 \
            --chain.networkId 1337 \
            --wallet.deterministic \
            > ganache.log 2>&1 &

          echo "=== Waiting for ganache to accept connections ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -s -X POST -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep -q result; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Ganache did not become ready in time." >&2
            cat ganache.log
            exit 1
          fi
          echo "Ganache is ready."

          echo "=== Running contract test suite ==="
          npx truffle test --network development

          echo "=== Migrating contracts (verifies the full deploy path) ==="
          npx truffle migrate --network development --reset

      - name: Upload contract build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-contracts-build
          path: code/blockchain/build/contracts/
          retention-days: 7
