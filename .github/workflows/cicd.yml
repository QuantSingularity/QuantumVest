name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ======================================================================
  # Job 2 -- Backend Test & Build (Pytest + Docker image + smoke test)
  # ======================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend
      IMAGE_NAME: quantumvest-backend
      CONTAINER_NAME: quantumvest-backend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code
          file: code/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs as a non-root user
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "${IMAGE_NAME}:ci" -u)
          echo "Container user id: ${uid}"
          if [ "${uid}" = "0" ]; then
            echo "Image must not run as root." >&2
            exit 1
          fi

      - name: Smoke test the built image
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 5000:5000 \
            -e FLASK_ENV=docker \
            -e SECRET_KEY=ci-smoke-test-secret-key \
            -e JWT_SECRET_KEY=ci-smoke-test-jwt-secret-key \
            -e DATABASE_URL=sqlite:////tmp/quantumvest-ci.db \
            -e AI_AUTO_TRAIN=false \
            -e BLOCKCHAIN_ENABLED=false \
            "${IMAGE_NAME}:ci"

          echo "=== Waiting for backend health endpoint ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/v1/health -o health.json; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Backend did not become healthy in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "=== Health response ==="
          cat health.json
          echo
          grep -q '"status":"healthy"' <(tr -d ' \n' < health.json) || {
            echo "Health endpoint reported a non-healthy status." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          }

          echo "=== Checking Prometheus metrics endpoint ==="
          curl -fsS http://127.0.0.1:5000/metrics | grep -q http_requests_total

      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 3 -- AI Models Test & Validation (Pytest + coverage)
  # ============================================================
  ai_models_test:
    name: AI Models Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      AI_MODELS_DIR: code/ai_models
      # ai_models is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code
      # Keep TensorFlow quiet and make sure nothing tries to use a GPU on the runner.
      TF_CPP_MIN_LOG_LEVEL: "2"
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            code/ai_models/requirements.txt
            code/ai_models/requirements-dev.txt

      # requirements-dev.txt extends requirements.txt (TensorFlow, XGBoost,
      # LightGBM, ...) with CatBoost, pytest and pytest-cov.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "${AI_MODELS_DIR}/requirements-dev.txt"

      - name: Byte-compile all ai_models sources
        run: |
          set -euo pipefail
          echo "=== Compiling data, models, portfolio, risk, serving, training, evaluation and tests ==="
          python -m compileall -q "${AI_MODELS_DIR}"

      - name: Verify public API and sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          import ai_models

          for name in ai_models.__all__:
              getattr(ai_models, name)
              print(f"OK   ai_models.{name}")

          for module in (
              "data",
              "evaluation",
              "exceptions",
              "models",
              "portfolio",
              "risk",
              "serving",
              "training",
              "advanced_ai_models",
          ):
              importlib.import_module(f"ai_models.{module}")
              print(f"OK   ai_models.{module}")
          print(f"ai_models {ai_models.__version__} imports cleanly")
          PY

      - name: Run ai_models test suite
        working-directory: ${{ env.AI_MODELS_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=ai_models \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload ai_models coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-coverage-report
          path: code/ai_models/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 4 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/build/
          retention-days: 7

  # ============================================================
  # Job 5 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 6 -- Blockchain Contracts (Compile & Test)
  # ============================================================
  blockchain_tests:
    name: Blockchain Contracts
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx truffle compile

      - name: Start ganache, run tests, and verify the migration
        run: |
          set -euo pipefail

          npx ganache \
            --port 8545 \
            --chain.chainId 1337 \
            --chain.networkId 1337 \
            --wallet.deterministic \
            > ganache.log 2>&1 &

          echo "=== Waiting for ganache to accept connections ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -s -X POST -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep -q result; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Ganache did not become ready in time." >&2
            cat ganache.log
            exit 1
          fi
          echo "Ganache is ready."

          echo "=== Running contract test suite ==="
          npx truffle test --network development

          echo "=== Migrating contracts (verifies the full deploy path) ==="
          npx truffle migrate --network development --reset

      - name: Upload contract build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-contracts-build
          path: code/blockchain/build/contracts/
          retention-days: 7

  # ============================================================
  # Job 7 -- Docs Validation
  # ============================================================
  docs_validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Markdown (docs/ and root README)
        run: |
          set -euo pipefail
          # Line length is left to Prettier (code_quality job); inline HTML is
          # allowed for the badges/images in the README.
          cat > "$RUNNER_TEMP/markdownlint.jsonc" <<'EOF'
          {
            "config": {
              "default": true,
              "MD013": false,
              "MD033": {
                "allowed_elements": ["img", "div", "p", "br", "a", "picture", "source", "details", "summary"]
              }
            }
          }
          EOF
          npx --yes markdownlint-cli2@0.24.0 --config "$RUNNER_TEMP/markdownlint.jsonc" "docs/**/*.md" README.md

      - name: Install lychee (link checker)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin" --strip-components=1 --wildcards '*/lychee'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check internal links and anchors
        run: |
          lychee --offline --no-progress --include-fragments \
            'docs/**/*.md' README.md scripts/README.md infrastructure/README.md .github/readme/README.md

      - name: Validate code samples (python, bash, json)
        run: |
          python - <<'PY'
          import ast, json, pathlib, re, subprocess, sys

          FENCE = re.compile(r"^```([A-Za-z0-9_+-]*)[^\n]*\n(.*?)^```", re.S | re.M)
          failures = checked = 0
          files = sorted(pathlib.Path("docs").rglob("*.md")) + [pathlib.Path("README.md")]
          for path in files:
              text = path.read_text(encoding="utf-8")
              for m in FENCE.finditer(text):
                  lang, body = m.group(1).lower(), m.group(2)
                  line = text.count("\n", 0, m.start()) + 1
                  err = None
                  if lang in ("python", "py"):
                      try:
                          ast.parse(body)
                      except SyntaxError as e:
                          err = f"python: {e.msg} (block line {e.lineno})"
                  elif lang in ("bash", "sh", "shell"):
                      r = subprocess.run(["bash", "-n"], input=body, text=True, capture_output=True)
                      if r.returncode:
                          err = "bash: " + r.stderr.strip().splitlines()[-1]
                  elif lang == "json":
                      try:
                          json.loads(body)
                      except ValueError as e:
                          err = f"json: {e}"
                  else:
                      continue
                  checked += 1
                  if err:
                      failures += 1
                      print(f"::error file={path},line={line}::{err}")
          print(f"Checked {checked} code blocks, {failures} invalid")
          sys.exit(1 if failures else 0)
          PY

      - name: Check docs are consistent with the repository
        run: |
          set -euo pipefail
          status=0

          # Every script in scripts/ must have a "#### name.sh" section in
          # docs/CLI.md, and every such section must have a script.
          scripts=$(for f in scripts/*.sh; do basename "$f"; done | sort)
          documented=$(grep -oE '^#{3,4} [A-Za-z0-9_-]+\.sh' docs/CLI.md | sed -E 's/^#+ //' | sort -u)
          for s in $(comm -23 <(echo "$scripts") <(echo "$documented")); do
            echo "::error file=docs/CLI.md::scripts/$s exists but is not documented in docs/CLI.md"; status=1
          done
          for s in $(comm -13 <(echo "$scripts") <(echo "$documented")); do
            echo "::error file=docs/CLI.md::docs/CLI.md documents $s but scripts/$s does not exist"; status=1
          done

          # Every page in docs/ must be reachable from the docs index.
          for f in docs/*.md docs/examples/*.md; do
            name=${f#docs/}
            [ "$name" = "README.md" ] && continue
            grep -q "($name)" docs/README.md || { echo "::error file=$f::not linked from docs/README.md"; status=1; }
          done

          # Large binaries bloat clones; warn only.
          while IFS= read -r big; do
            echo "::warning file=$big::file is larger than 5 MB; consider compressing it (e.g. PNG/WebP instead of BMP)"
          done < <(find docs -type f -size +5M)

          exit "$status"

      - name: Check external links (advisory)
        continue-on-error: true
        run: |
          lychee --no-progress --max-retries 2 --timeout 20 --accept '200..=299,429' \
            'docs/**/*.md' README.md

  # ============================================================
  # Job 8 -- Infrastructure Validation
  # (Terraform, Helm/Kubernetes, Ansible, Docker)
  # ============================================================
  infrastructure_validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 30

    env:
      KUBERNETES_VERSION: "1.28.0"
      KUBECONFORM_VERSION: "0.8.0"
      HELM_VERSION: "v3.16.4"
      HADOLINT_VERSION: "2.15.1"
      ANSIBLE_CONFIG: ${{ github.workspace }}/infrastructure/ansible/ansible.cfg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements-ci.txt

      - name: Install CI tooling (pinned in infrastructure/requirements-ci.txt)
        run: python -m pip install -r infrastructure/requirements-ci.txt

      # ---- Terraform ----------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        working-directory: infrastructure/terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Check root variables are wired up
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          status=0
          # Every root variable must be used somewhere outside variables.tf.
          while read -r v; do
            if ! grep -qE "var\\.${v}\\b" main.tf outputs.tf; then
              echo "::error file=infrastructure/terraform/variables.tf::variable ${v} is declared but never used"
              status=1
            fi
          done < <(grep -ohE '^variable "[a-z0-9_]+"' variables.tf | cut -d'"' -f2)
          # Every key in an environment tfvars file must be a declared variable.
          for f in environments/*/terraform.tfvars; do
            while read -r k; do
              if ! grep -qE "^variable \"${k}\"" variables.tf; then
                echo "::error file=infrastructure/terraform/${f}::${k} is not a declared variable"
                status=1
              fi
            done < <(grep -oE '^[a-z0-9_]+\s*=' "$f" | tr -d ' =')
          done
          exit "$status"

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0

      - name: TFLint (fails on errors, prints warnings)
        working-directory: infrastructure/terraform
        run: tflint --recursive --minimum-failure-severity=error

      # ---- Kubernetes (Helm chart) --------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Helm lint (default values and every environment)
        working-directory: infrastructure/kubernetes
        run: |
          set -euo pipefail
          helm lint .
          for env in dev staging prod; do
            helm lint . -f "environments/$env/values.yaml"
          done

      # Rendered offline, so no cluster is needed.
      - name: Render and validate Kubernetes manifests for every environment
        working-directory: infrastructure/kubernetes
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            helm template quantumvest . -f "environments/$env/values.yaml" > "$RUNNER_TEMP/k8s-$env.yaml"
            kubeconform -kubernetes-version "$KUBERNETES_VERSION" -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$RUNNER_TEMP/k8s-$env.yaml"
          done
          python - <<'PY'
          import os, sys, yaml

          expected = {"dev": "quantumvest-dev", "staging": "quantumvest-staging", "prod": "quantumvest-production"}
          cluster_scoped = {"Namespace", "ClusterRole", "ClusterRoleBinding"}
          problems = []
          for env, ns in expected.items():
              with open(os.path.join(os.environ["RUNNER_TEMP"], f"k8s-{env}.yaml")) as f:
                  docs = [d for d in yaml.safe_load_all(f) if d]
              names = [d["metadata"]["name"] for d in docs if d["kind"] == "Namespace"]
              if names != [ns]:
                  problems.append(f"{env}: expected exactly one Namespace {ns}, found {names}")
              for d in docs:
                  if d["kind"] not in cluster_scoped and d["metadata"].get("namespace") != ns:
                      problems.append(f"{env}: {d['kind']}/{d['metadata']['name']} is not in namespace {ns}")
              # No resource may be rendered twice (e.g. an example Secret left in templates/)
              ids = [(d["kind"], d["metadata"]["name"]) for d in docs]
              for dup in sorted({i for i in ids if ids.count(i) > 1}):
                  problems.append(f"{env}: {dup[0]}/{dup[1]} is rendered more than once")
              # Service hostnames in the ConfigMap must match Services that exist
              services = {d["metadata"]["name"] for d in docs if d["kind"] == "Service"}
              config = next(d for d in docs if d["kind"] == "ConfigMap" and d["metadata"]["name"].endswith("backend-config"))["data"]
              for key in ("API_URL", "REDIS_HOST", "DATABASE_HOST"):
                  host = config[key].split("://")[-1]
                  if host not in services:
                      problems.append(f"{env}: ConfigMap {key}={host} does not match any Service {sorted(services)}")
              # Production must not run floating image tags
              if env == "prod":
                  for d in docs:
                      if d["kind"] in ("Deployment", "StatefulSet"):
                          for c in d["spec"]["template"]["spec"]["containers"]:
                              if c["image"].endswith(":latest") or ":" not in c["image"].rsplit("/", 1)[-1]:
                                  problems.append(f"prod: {d['kind']}/{d['metadata']['name']} uses a floating image tag: {c['image']}")
          for p in problems:
              print(f"::error::{p}")
          print("Environments OK" if not problems else f"{len(problems)} problem(s)")
          sys.exit(1 if problems else 0)
          PY

      # ---- Ansible ------------------------------------------
      - name: Install Ansible collections
        working-directory: infrastructure/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          if [ ! -f inventory/hosts.yml ]; then
            echo "::notice::inventory/hosts.yml is not tracked; validating with the example inventory"
            cp inventory/hosts.example.yml inventory/hosts.yml
          fi
          ansible-playbook --syntax-check playbooks/main.yml

      - name: Check every play matches at least one host
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          empty=$(ansible-playbook --list-hosts playbooks/main.yml | awk '/^ *play #/{play=$0} /hosts \(0\)/{print play}')
          if [ -n "$empty" ]; then
            while IFS= read -r line; do
              echo "::error::play matches no hosts: $line"
            done <<< "$empty"
            exit 1
          fi

      - name: ansible-lint (content must load; full style rules are not enforced)
        working-directory: infrastructure/ansible
        run: ansible-lint --offline --profile min .

      - name: Check role template and include references resolve
        working-directory: infrastructure/ansible
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          def walk(tasks):
              for task in tasks or []:
                  yield task
                  for key in ("block", "rescue", "always"):
                      yield from walk(task.get(key))

          bad = 0
          for tasks_file in sorted(pathlib.Path("roles").glob("*/tasks/*.yml")):
              role = tasks_file.parents[1]
              for task in walk(yaml.safe_load(tasks_file.read_text())):
                  for mod in ("template", "ansible.builtin.template"):
                      if mod in task:
                          src = task[mod]["src"]
                          if "{{" not in src and not (role / "templates" / src).exists():
                              print(f"::error file=infrastructure/ansible/{tasks_file}::template {src} does not exist in {role}/templates")
                              bad += 1
                  for mod in ("include_tasks", "import_tasks", "ansible.builtin.include_tasks", "ansible.builtin.import_tasks"):
                      if mod in task:
                          ref = task[mod] if isinstance(task[mod], str) else task[mod].get("file")
                          if ref and "{{" not in ref and not (tasks_file.parent / ref).exists():
                              print(f"::error file=infrastructure/ansible/{tasks_file}::{mod} {ref} does not exist")
                              bad += 1
          print("All references resolve" if not bad else f"{bad} unresolved reference(s)")
          sys.exit(1 if bad else 0)
          PY

      # Rendering with Ansible's own engine catches undefined variables and template
      # syntax errors that a syntax check cannot.
      - name: Render role templates
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rendered"
          cat > "$RUNNER_TEMP/render.yml" <<'EOF'
          - hosts: localhost
            connection: local
            gather_facts: true
            vars_files:
              - "{{ ansible_dir }}/group_vars/all/vars.yml"
              - "{{ role_dir }}/vars/main.yml"
            tasks:
              - ansible.builtin.template:
                  src: "{{ item }}"
                  dest: "{{ out_dir }}/{{ role_label }}-{{ item | basename | regex_replace('[.]j2$', '') }}"
                  mode: "0644"
                with_fileglob: "{{ role_dir }}/templates/*.j2"
          EOF
          for role_dir in roles/*/; do
            role=$(basename "$role_dir")
            [ -d "$role_dir/templates" ] || continue
            ansible-playbook -i localhost, "$RUNNER_TEMP/render.yml" \
              -e "ansible_dir=$PWD" -e "role_dir=$PWD/roles/$role" \
              -e "role_label=$role" -e "out_dir=$RUNNER_TEMP/rendered"
          done
          ls -l "$RUNNER_TEMP/rendered"
          if grep -rn '{{' "$RUNNER_TEMP/rendered"; then
            echo "::error::unrendered template expressions found in the output above"
            exit 1
          fi

      - name: yamllint (Chart, values, Ansible, Compose)
        working-directory: infrastructure
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" \
            kubernetes/Chart.yaml kubernetes/values.yaml kubernetes/environments ansible docker-compose.yml

      # ---- Docker -------------------------------------------
      - name: Validate Docker Compose files
        working-directory: infrastructure
        run: |
          set -euo pipefail
          # The compose file requires secrets via ${VAR:?}; use the example values.
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile monitoring config --quiet

      - name: Lint Dockerfiles (fails on errors, prints warnings)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          chmod +x "$HOME/.local/bin/hadolint"
          hadolint --failure-threshold error \
            infrastructure/docker/Dockerfile.backend infrastructure/docker/Dockerfile.frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Backend job builds code/Dockerfile; build the images used by
      # infrastructure/docker-compose.yml and the Helm chart here.
      - name: Build backend Docker image (infrastructure)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          push: false
          tags: quantumvest/backend:infra-ci-${{ github.sha }}
          cache-from: type=gha,scope=infra-backend-image
          cache-to: type=gha,mode=max,scope=infra-backend-image

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: false
          tags: quantumvest/frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

      # ---- Secrets ------------------------------------------
      - name: Scan infrastructure for hard-coded secrets
        working-directory: infrastructure
        run: |
          set -uo pipefail
          found=0
          # Markdown is excluded: READMEs contain example commands, and the
          # Docs Validation job covers them.
          for pattern in 'password\s*=\s*"[^"]{8,}"' 'secret\s*=\s*"[^"]{8,}"' 'api[_-]key\s*=\s*"[^"]{8,}"' 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY'; do
            hits=$(grep -rEIin --exclude='*.md' "$pattern" terraform kubernetes ansible \
              | grep -v '\.example' \
              | grep -viE 'placeholder|change_?me|:[0-9]+:\s*#' || true)
            if [ -n "$hits" ]; then
              echo "::error::possible hard-coded secret matching /$pattern/"
              echo "$hits"
              found=1
            fi
          done
          exit "$found"

  # ============================================================
  # Job 9 -- Scripts Validation
  # ============================================================
  scripts_validation:
    name: Scripts Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ShellCheck
        run: python -m pip install shellcheck-py==0.11.0.1

      - name: ShellCheck all tracked shell scripts (fails on warnings and errors)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

      - name: ShellCheck stricter style findings (advisory)
        continue-on-error: true
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=info

      - name: Check syntax and shebang of all tracked shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
            head -n 1 "$f" | grep -qE '^#!.*(bash|sh)' || { echo "::error file=$f::missing shebang"; exit 1; }
          done < <(git ls-files -z '*.sh')

      - name: Check shell scripts are executable in git
        run: |
          missing=$(git ls-files -s '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$missing" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::not executable in git. Fix: git update-index --chmod=+x $f"
            done <<< "$missing"
            exit 1
          fi

      # Only scripts with a real --help handler are listed: the others
      # (run_quantumvest.sh, run_all_tests.sh, ...) would start services
      # or run test suites instead of printing usage.
      - name: Smoke test --help on CLI scripts
        run: |
          set -uo pipefail
          status=0
          before=$(git status --porcelain)
          for s in cicd deploy dev_workflow maintenance; do
            if out=$(timeout 30 bash "scripts/$s.sh" --help </dev/null 2>&1) && grep -qi 'usage' <<< "$out"; then
              echo "OK   $s.sh --help"
            else
              echo "::error file=scripts/$s.sh::--help did not exit 0 with a usage message"
              status=1
            fi
          done
          after=$(git status --porcelain)
          if [ "$before" != "$after" ]; then
            echo "::error::--help modified the working tree:"; git status --porcelain; status=1
          fi
          exit "$status"
